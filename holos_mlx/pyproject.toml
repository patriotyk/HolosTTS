[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "holos-tts-mlx"
version = "0.1"
description = "HolosTTS inference on Apple silicon with MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.29",
    "numpy>=1.24",
    "huggingface-hub>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
