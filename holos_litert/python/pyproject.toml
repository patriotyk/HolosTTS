[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "holos-tts-litert"
version = "0.1"
description = "HolosTTS inference with LiteRT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ai-edge-litert>=2.2",
    "numpy>=1.24",
    "huggingface-hub>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
