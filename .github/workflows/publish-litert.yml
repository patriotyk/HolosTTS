name: Publish holos-tts-litert

# Push a tag such as litert-v0.1 that matches the version in
# holos_litert/python/pyproject.toml.
on:
  push:
    tags:
      - "litert-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holos_litert/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          python - <<'EOF'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("litert-v")
          if tag != version:
              raise SystemExit(f"Tag litert-v{tag} does not match holos_litert/python/pyproject.toml version {version}")
          EOF
      - name: Test
        # The tests download the model from litert/ on Hugging Face (270 MB)
        # and run it on the CPU.
        run: |
          python -m pip install .
          python tests/test_inference.py
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: holos_litert/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/holos-tts-litert
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
