name: Publish holos-tts-onnx

# Push a tag such as onnx-v0.2.0 that matches the version in
# holos_onnx/pyproject.toml.
on:
  push:
    tags:
      - "onnx-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holos_onnx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          python - <<'EOF'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("onnx-v")
          if tag != version:
              raise SystemExit(f"Tag onnx-v{tag} does not match holos_onnx/pyproject.toml version {version}")
          EOF
      - name: Test
        # The CPU onnxruntime is enough: the tests use fake sessions.
        run: |
          python -m pip install numpy huggingface-hub onnxruntime
          python tests/test_inference.py
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: holos_onnx/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/holos-tts-onnx
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
