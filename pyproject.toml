[build-system]
requires = ["setuptools>=62.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holos"
version = "0.1.0"
description = "Holos TTS inference package"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[project.optional-dependencies]
gradio = [
    "gradio",
]
onnx = [
    "onnx",
    "onnxruntime",
]

[project.scripts]
holos-app = "gradio_app.app:main"
holos-export-onnx = "holos.onnx_export:main"
holos-convert-voices = "holos.voices:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements_inference.txt"]}

[tool.setuptools.packages.find]
include = ["holos*", "gradio_app*"]
exclude = ["holos_onnx*"]
