[build-system]
requires = ["setuptools>=62.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holos"
version = "0.1.0"
description = "Holos TTS inference package"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[project.optional-dependencies]
gradio = [
    "gradio",
]

[project.scripts]
holos-app = "app:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements_inference.txt"]}

[tool.setuptools.packages.find]
include = ["holos*"]

[tool.setuptools]
py-modules = ["app"]
