[build-system]
requires = ["setuptools>=62.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holos-tts"
version = "0.2"
description = "Holos TTS inference package"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements_inference.txt"]}

[tool.setuptools.packages.find]
include = ["holos", "holos.*"]
