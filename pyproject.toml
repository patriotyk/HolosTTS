[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "holos-tts"
version = "0.4"
description = "HolosTTS text-to-speech on PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements_inference.txt"]}

[tool.setuptools.packages.find]
include = ["holos", "holos.*"]
