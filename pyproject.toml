[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holos"
version = "0.1.0"
description = "Holos TTS inference package"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "scipy",
    "transformers",
]

[tool.setuptools.packages.find]
include = ["holos*"]
